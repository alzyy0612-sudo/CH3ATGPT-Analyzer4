name: Build CH3ATGPT Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir project
          unzip -q CH3ATGPT_Analyzer_OnlineBuild.zip -d project

      - name: Find Gradle Project
        run: |
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CH3ATGPT-Analyzer-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
